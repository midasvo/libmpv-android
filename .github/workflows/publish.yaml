name: Publish

# Releases a vX.Y.Z tag: guard, the same build as every pull request (build.yaml, called
# with release: true, so no caches), then signing, provenance, the draft GitHub release
# and, last, the Maven Central upload. See RELEASING.md.
#
# Dry run: Actions → Publish → Run workflow (or `gh workflow run publish.yaml -f version=X.Y.Z`)
# runs every step with the same commands, except that it signs with a throwaway key,
# publishes to the runner's local Maven repository, and creates no attestation and no
# release. It uses no environment and no secret.

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse (dry run; must not be on Maven Central yet)
        type: string
        default: 0.0.0

permissions:
  contents: read

# Two runs for the same tag (a re-pushed tag) must not overlap: queue, never cancel
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Check tag
    runs-on: ubuntu-26.04
    if: ${{ github.repository == 'midasvo/libmpv-android' }}
    outputs:
      version: ${{ steps.check.outputs.version }}
      dry-run: ${{ steps.check.outputs.dry-run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Maven Central releases cannot be undone: only publish clean semver tags whose
      # commit is on main and whose version is not on Maven Central yet (a moved or
      # re-pushed tag must not touch the release or upload again).
      # FETCH_HEAD is used because a tag checkout may have no origin/main ref.
      # Only a tag push is a real release; everything else is a dry run.
      - name: Check tag
        id: check
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          DRY_RUN: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'false' || 'true' }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH without leading zeros (for example v1.2.0)"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::$GITHUB_SHA is not on main; a real release of it would stop here"
            else
              echo "::error::Tag '$TAG' ($GITHUB_SHA) is not on main; tag a commit that is merged into main"
              exit 1
            fi
          fi
          version="${TAG#v}"
          pom="https://repo1.maven.org/maven2/io/github/midasvo/libmpv/$version/libmpv-$version.pom"
          status=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 \
                        --retry 3 --retry-delay 10 "$pom") || true
          case "$status" in
            404) ;;
            200)
              echo "::error::Version $version is already on Maven Central; release the next version instead"
              exit 1
              ;;
            *)
              echo "::error::Could not check whether $version is already on Maven Central (HTTP status '$status' for $pom)"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry-run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Version $version, dry run: $DRY_RUN"

  # No secrets are passed to the build.
  build:
    name: Build
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml
    with:
      release: true
      version: ${{ needs.guard.outputs.version }}

  publish:
    # Anything but an explicit 'false' from the guard is a dry run: no environment, no
    # secrets, nothing published.
    name: ${{ needs.guard.outputs.dry-run == 'false' && 'Publish' || 'Publish (dry run)' }}
    needs: [guard, build]
    runs-on: ubuntu-26.04
    environment: ${{ needs.guard.outputs.dry-run == 'false' && 'release' || '' }}
    permissions:
      contents: write # create the draft GitHub release (the repo default token is read-only)
      id-token: write # provenance attestation (Sigstore certificate)
      attestations: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: v${{ needs.guard.outputs.version }}
      DRY_RUN: ${{ needs.guard.outputs.dry-run == 'false' && 'false' || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes need the merge-base with upstream

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Install SDK
        working-directory: buildscripts
        env:
          IN_CI: 1
          SDK_WITHOUT_NDK: 1
        run: ./include/download-sdk.sh

      # What the build job bundled, checked and tested, and the files it was bundled from
      - uses: actions/download-artifact@v8
        with:
          name: jniLibs
          path: ./libmpv/src/main/jniLibs
      - uses: actions/download-artifact@v8
        with:
          name: libmpv-release.aar
          path: ${{ runner.temp }}/built
      - uses: actions/download-artifact@v8
        with:
          name: build-info
          path: ${{ runner.temp }}/info
      - uses: actions/download-artifact@v8
        with:
          pattern: native-info-*
          path: ${{ runner.temp }}/native-info
      - uses: actions/download-artifact@v8
        with:
          name: sources
          path: ${{ runner.temp }}/release

      # Same mode as player.sh gives them in the build job (artifacts do not keep modes)
      - name: Normalise file modes
        run: find libmpv/src/main/jniLibs -type f -exec chmod 0644 {} +

      - name: Make a throwaway signing key (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase dry-run \
              --quick-gen-key 'libmpv-android dry run (throwaway)' rsa3072 sign 1d
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          {
            echo "DRY_RUN_SIGNING_KEY<<END_OF_KEY"
            gpg --batch --pinentry-mode loopback --passphrase dry-run --armor --export-secret-keys "$fpr"
            echo "END_OF_KEY"
            echo "DRY_RUN_SIGNING_KEY_ID=${fpr: -8}"
          } >> "$GITHUB_ENV"

      # The AAR that ships is the one the build job checked and tested: Gradle bundles it
      # again here (from the same jniLibs) only to sign it, and the bytes must match.
      - name: Bundle and sign
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ env.DRY_RUN == 'false' && secrets.SIGNING_KEY || env.DRY_RUN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ env.DRY_RUN == 'false' && secrets.SIGNING_KEY_ID || env.DRY_RUN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ env.DRY_RUN == 'false' && secrets.SIGNING_PASSWORD || 'dry-run' }}
        run: |
          ./gradlew signMavenPublication --no-configuration-cache -PVERSION_NAME="$VERSION"
          aar=libmpv/build/outputs/aar/libmpv-release.aar
          if [ ! -f "$aar.asc" ]; then
            echo "::error::No signature found next to $aar"
            find libmpv/build -name '*.asc'
            exit 1
          fi
          built=$(sha256sum "$RUNNER_TEMP/built/libmpv-release.aar" | cut -d' ' -f1)
          actual=$(sha256sum "$aar" | cut -d' ' -f1)
          if [ "$actual" != "$built" ]; then
            echo "::error::Gradle bundled a different AAR here ($actual) than the build job checked and tested ($built)"
            exit 1
          fi
          # Attached under the Maven Central name, so it pairs with its .asc
          cp "$aar" "$RUNNER_TEMP/release/libmpv-$VERSION.aar"
          cp "$aar.asc" "$RUNNER_TEMP/release/libmpv-$VERSION.aar.asc"
          cp "$RUNNER_TEMP/info/libmpv-$VERSION.cdx.json" "$RUNNER_TEMP/release/"
          echo "AAR_SHA256=$actual" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/release"

      - name: Attest build provenance
        if: env.DRY_RUN == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/libmpv-${{ env.VERSION }}.aar
            ${{ runner.temp }}/release/libmpv-${{ env.VERSION }}-sources.tar.xz

      - name: Write release notes
        run: |
          git fetch --quiet https://github.com/jarnedemeulemeester/libmpv-android.git main
          upstream=$(git merge-base HEAD FETCH_HEAD)
          {
            echo "\`io.github.midasvo:libmpv:${VERSION}\`"
            echo
            echo "Based on upstream jarnedemeulemeester/libmpv-android@${upstream}."
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            sed -n 's/^v_\([a-z0-9_]*\)=\(.*\)$/| \1 | \2 |/p' buildscripts/include/depinfo.sh
            echo
            echo "Built with:"
            echo
            echo "| Tool | Version |"
            echo "|---|---|"
            cat "$RUNNER_TEMP"/native-info/*/tools.txt "$RUNNER_TEMP/info/tools-assemble.txt" | sort -u
            echo
            echo "## Licence"
            echo
            echo "The native libraries in this AAR are effectively **GPL-3.0-or-later** (\`libmpv.so\` links FFmpeg and other GPL components). Licences per component are listed in the [README](https://github.com/midasvo/libmpv-android/blob/${TAG}/README.md#licensing) and in the SBOM, \`libmpv-${VERSION}.cdx.json\` (CycloneDX)."
            echo
            echo "The complete corresponding source of this build (this repository at \`${TAG}\`, every dependency as downloaded and patched, and the Rust crates of the wrapper vendored under \`libmpv/src/main/rust/vendor\`) is attached as \`libmpv-${VERSION}-sources.tar.xz\`."
            echo
            echo "The AAR attached here is the exact file on Maven Central (\`libmpv-${VERSION}.aar\`, sha256 \`${AAR_SHA256}\`), and \`libmpv-${VERSION}.aar.asc\` is its signature. Its build provenance can be checked with \`gh attestation verify libmpv-${VERSION}.aar -R midasvo/libmpv-android\`."
          } > release-notes.md
          cat release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # A re-run after a failure before the upload finds its own draft and updates it
      - name: Create the draft release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP"/release/*)
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::Release $TAG is already published; release the next version instead"
              exit 1
            fi
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes-file release-notes.md "${files[@]}"
          fi

      # Last on purpose: the upload to Maven Central cannot be undone, so everything that
      # can fail (checks, notes, the release with the GPL source) comes first.
      - name: ${{ env.DRY_RUN == 'false' && 'Publish to Maven Central' || 'Publish to the local Maven repository (dry run)' }}
        env:
          TASK: ${{ env.DRY_RUN == 'false' && 'publishToMavenCentral' || 'publishToMavenLocal' }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ env.DRY_RUN == 'false' && secrets.OSSRH_USERNAME || '' }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ env.DRY_RUN == 'false' && secrets.OSSRH_PASSWORD || '' }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ env.DRY_RUN == 'false' && secrets.SIGNING_KEY || env.DRY_RUN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ env.DRY_RUN == 'false' && secrets.SIGNING_KEY_ID || env.DRY_RUN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ env.DRY_RUN == 'false' && secrets.SIGNING_PASSWORD || 'dry-run' }}
        run: |
          ./gradlew "$TASK" --no-configuration-cache -PVERSION_NAME="$VERSION"
          actual=$(sha256sum libmpv/build/outputs/aar/libmpv-release.aar | cut -d' ' -f1)
          if [ "$actual" != "$AAR_SHA256" ]; then
            echo "::error::The uploaded AAR ($actual) is not the one on the draft release ($AAR_SHA256). Replace the release's AAR and .asc with the files from repo1.maven.org before publishing the release."
            exit 1
          fi
          if [ "$DRY_RUN" = true ]; then
            ls -l ~/.m2/repository/io/github/midasvo/libmpv/"$VERSION"/
          fi
