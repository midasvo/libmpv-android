name: Publish

on:
  push:
    tags:
      - v*

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: release
    if: ${{ github.repository == 'midasvo/libmpv-android' }}
    # two runs for the same tag (a re-pushed tag) must not overlap: queue, never cancel
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # create the draft GitHub release (the repo default token is read-only)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes need the merge-base with upstream

      # Maven Central releases cannot be undone: only publish clean semver tags
      # whose commit is on main and whose version is not on Maven Central yet
      # (a moved or re-pushed tag must not touch the release or upload again).
      # FETCH_HEAD is used because a tag checkout may have no origin/main ref.
      - name: Check tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH without leading zeros (for example v1.2.0)"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag '$TAG' ($GITHUB_SHA) is not on main; tag a commit that is merged into main"
            exit 1
          fi
          version="${TAG#v}"
          pom="https://repo1.maven.org/maven2/io/github/midasvo/libmpv/$version/libmpv-$version.pom"
          status=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 \
                        --retry 3 --retry-delay 10 "$pom") || true
          case "$status" in
            404) ;;
            200)
              echo "::error::Version $version is already on Maven Central; release the next version instead"
              exit 1
              ;;
            *)
              echo "::error::Could not check whether $version is already on Maven Central (HTTP status '$status' for $pom)"
              exit 1
              ;;
          esac

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip python3-jinja2 gperf nasm
          sudo pip3 install --break-system-packages meson

      - name: Download dependencies
        working-directory: ./buildscripts
        env:
          IN_CI: 1
          # retries for flaky hosts (lua.org TLS dropped a main build); download-deps.sh reads $WGET
          WGET: wget --tries=5 --waitretry=10 --retry-connrefused --retry-on-host-error
        run: ./download.sh

      - name: Apply patches
        working-directory: ./buildscripts
        run: ./patch.sh

      # GPL corresponding source: this repository at the tag plus every
      # dependency exactly as it is built (downloaded and patched).
      # Packed before the build so no build output ends up in it.
      - name: Pack corresponding source
        run: |
          name="libmpv-${GITHUB_REF_NAME#v}-sources"
          tar --exclude=.git --exclude=./buildscripts/sdk \
              --transform "s,^\.,$name," -cf - . | xz -T0 -6 > "$RUNNER_TEMP/$name.tar.xz"
          ls -lh "$RUNNER_TEMP/$name.tar.xz"

      - name: Build
        working-directory: ./buildscripts
        run: ./build.sh

      - name: Check AAR
        run: ./buildscripts/check-aar.sh

      - name: Write release notes
        run: |
          git fetch --quiet https://github.com/jarnedemeulemeester/libmpv-android.git main
          upstream=$(git merge-base HEAD FETCH_HEAD)
          {
            echo "\`io.github.midasvo:libmpv:${GITHUB_REF_NAME#v}\`"
            echo
            echo "Based on upstream jarnedemeulemeester/libmpv-android@${upstream}."
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            sed -n 's/^v_\([a-z0-9_]*\)=\(.*\)$/| \1 | \2 |/p' buildscripts/include/depinfo.sh
            echo
            echo "## Licence"
            echo
            echo "The native libraries in this AAR are effectively **GPL-3.0-or-later** (\`libmpv.so\` links FFmpeg and other GPL components). Licences per component are listed in the [README](https://github.com/midasvo/libmpv-android/blob/${GITHUB_REF_NAME}/README.md#licensing)."
            echo
            echo "The complete corresponding source of this build (this repository at \`${GITHUB_REF_NAME}\` plus every dependency as downloaded and patched) is attached as \`libmpv-${GITHUB_REF_NAME#v}-sources.tar.xz\`."
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-notes.md
          files: |
            ./libmpv/build/outputs/aar/libmpv-release.aar
            ${{ runner.temp }}/libmpv-*-sources.tar.xz

      # Last on purpose: the upload to Maven Central cannot be undone, so
      # everything that can fail (checks, notes, the release with the GPL
      # source) comes first.
      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache -PVERSION_NAME="${GITHUB_REF_NAME#v}"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
