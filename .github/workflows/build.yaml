name: Build libmpv-android

# The one build definition. Pull requests, main and sync-upstream.yaml (workflow_dispatch)
# run it directly; publish.yaml calls it (workflow_call, release: true) and adds only what
# a release does on top: signing, the GitHub release and the Maven Central upload.
#
#   lint ── native (x4) ──┬── assemble ──┬── test (x3) ───┐
#                         │              └── reproducible ┤
#                         └── sources ────────────────────┴── Build (the required check)
#
# lint:     shellcheck on the scripts and actionlint on the workflows, before anything
#           expensive starts (about 20 s on the critical path).
# native:   libmpv and its dependencies for one ABI (build.sh --arch <a> mpv), cached per
#           ABI except in release builds. Hands on prefix/<abi>/lib/*.so, the hashes of
#           the sources it was built from and the tool versions.
# assemble: builds the Rust wrapper for the four ABIs (player.sh, which also fills
#           jniLibs), bundles the AAR with Gradle (packaging only), checks it (libraries,
#           JNI exports, libplayer.so size, public API), runs the host unit tests and
#           writes the SBOM. Hands on the AAR and the jniLibs it was bundled from.
# test:     the instrumented tests on three emulators: API 34 and API 26 (minSdk) on
#           x86_64, and API 29 on x86 (32-bit; 29 is the newest API with a default x86
#           image). Each loads only its own ABI's libraries.
# reproducible: bundles the AAR again from those jniLibs and checks the bytes match (what
#           publish.yaml relies on).
# sources:  the GPL corresponding source (dependencies as downloaded and patched, Rust
#           crates vendored), checked to be exactly what every ABI was built from.
#
# Every job writes what it checked to its job summary (test counts, the native cache, the
# AAR's sha256, libplayer.so sizes).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # used by sync-upstream.yaml, whose PRs don't trigger pull_request
  workflow_call:
    inputs:
      release:
        description: "Release build: no caches, and the source tarball is uploaded"
        type: boolean
        default: false
      version:
        description: Version to bundle (VERSION_NAME)
        type: string
        default: 0.0.0-ci

permissions:
  contents: read

# Cancel superseded runs on pull requests only; every other run (main, workflow_dispatch,
# a release calling this) gets its own group and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERSION: ${{ inputs.version || '0.0.0-ci' }}
  RELEASE: ${{ inputs.release && 'true' || 'false' }}
  # retries for flaky hosts (lua.org TLS dropped a main build); the download scripts read $WGET
  WGET: wget --tries=5 --waitretry=10 --retry-connrefused --retry-on-host-error
  # Bump to throw away every cached native build (e.g. after an upstream re-tagged a release)
  NATIVE_CACHE_EPOCH: 1

jobs:
  # Severity enforced: shellcheck "error" (scripts and workflow run: blocks). Warnings are
  # reported as annotations but do not fail yet: the scripts inherited from upstream rely on
  # word splitting and on variables set by build.sh, and their warnings were never looked
  # at. Raise --severity to warning once the reported ones are fixed or annotated.
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    env:
      # https://github.com/rhysd/actionlint/releases: version and the SHA-256 of
      # actionlint_<version>_linux_amd64.tar.gz (from actionlint_<version>_checksums.txt)
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check renovate.json is valid JSON
        run: python3 -m json.tool renovate.json > /dev/null

      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      # buildscripts/.shellcheckrc and buildscripts/scripts/.shellcheckrc configure it.
      - name: shellcheck (errors fail)
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error

      - name: shellcheck (warnings, reported only)
        if: ${{ !cancelled() }}
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning --format=gcc > "$RUNNER_TEMP/shellcheck.txt" || true
          sed -E 's/^([^:]+):([0-9]+):([0-9]+): [a-z]+: (.*)$/::warning file=\1,line=\2,col=\3::\4/' "$RUNNER_TEMP/shellcheck.txt"
          echo "shellcheck warnings (not enforced yet): $(grep -c . "$RUNNER_TEMP/shellcheck.txt" || true)" >> "$GITHUB_STEP_SUMMARY"

      # A pinned release, checked against its SHA-256 before it runs. actionlint also runs
      # shellcheck on every run: block, at the severity set by SHELLCHECK_OPTS.
      - name: actionlint
        env:
          SHELLCHECK_OPTS: --severity=error
        run: |
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          "$RUNNER_TEMP/actionlint/actionlint" -color

  native:
    name: Native (${{ matrix.abi }})
    needs: lint
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: armv7l, abi: armeabi-v7a }
          - { arch: arm64, abi: arm64-v8a }
          - { arch: x86, abi: x86 }
          - { arch: x86_64, abi: x86_64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Everything that decides what lands in prefix/<abi>: versions and checksums
      # (depinfo.sh, also the NDK and meson), the commits the git tags are expected to be
      # (include/tag-commits.txt), the download, patch and build scripts, the patches, the
      # host tool list (include/install-system-deps.sh) and the runner OS.
      # player.sh and mpv-android.sh only run after the prefix is built, so they are left out.
      - name: Compute the cache key
        id: key
        run: |
          . buildscripts/include/depinfo.sh
          echo "key=native-$NATIVE_CACHE_EPOCH-${{ matrix.abi }}-$ImageOS-ndk$v_ndk-meson$v_meson-${{ hashFiles('buildscripts/include/**', 'buildscripts/build.sh', 'buildscripts/download.sh', 'buildscripts/patch.sh', 'buildscripts/scripts/**', '!buildscripts/scripts/player.sh', '!buildscripts/scripts/mpv-android.sh', 'buildscripts/patches/**') }}" >> "$GITHUB_OUTPUT"

      # Release builds never touch the cache: a tag run could otherwise restore what a
      # main run saved. Pull-request runs only see their own caches and main's.
      # Only what later jobs use is cached (the shared libraries and the record of what
      # they were built from), not the static libraries and headers of the whole prefix.
      - name: Restore the native build
        id: restore
        if: ${{ !inputs.release }}
        uses: actions/cache/restore@v6
        with:
          path: |
            buildscripts/prefix/${{ matrix.abi }}/lib/*.so
            buildscripts/prefix/${{ matrix.abi }}/sources.sha256
            buildscripts/prefix/${{ matrix.abi }}/tools.txt
          key: ${{ steps.key.outputs.key }}

      - name: Install tools, SDK and sources
        if: steps.restore.outputs.cache-hit != 'true'
        working-directory: buildscripts
        env:
          IN_CI: 1
        run: ./download.sh

      - name: Apply patches
        if: steps.restore.outputs.cache-hit != 'true'
        working-directory: buildscripts
        run: |
          ./patch.sh
          ./include/hash-sources.sh > "$RUNNER_TEMP/sources.sha256"
          cat "$RUNNER_TEMP/sources.sha256"

      - name: Build
        if: steps.restore.outputs.cache-hit != 'true'
        working-directory: buildscripts
        run: ./build.sh --arch ${{ matrix.arch }} mpv

      # Stored in the prefix, so a cache hit reports the tools and sources of the build
      # that produced it, not of this run.
      - name: Record sources and tools
        if: steps.restore.outputs.cache-hit != 'true'
        env:
          PREFIX: buildscripts/prefix/${{ matrix.abi }}
        run: |
          cp "$RUNNER_TEMP/sources.sha256" "$PREFIX/sources.sha256"
          {
            echo "| runner image (native builds) | $ImageOS $ImageVersion |"
            echo "| meson | $(meson --version) |"
            echo "| ninja | $(ninja --version) |"
            echo "| nasm | $(nasm -v | cut -d' ' -f3) |"
            echo "| autoconf | $(autoconf --version | head -n1 | awk '{print $NF}') |"
            echo "| libtool | $(libtoolize --version | head -n1 | awk '{print $NF}') |"
            echo "| pkgconf | $(pkg-config --version) |"
            echo "| gperf | $(gperf --version | head -n1 | awk '{print $NF}') |"
            echo "| GNU make | $(make --version | head -n1 | awk '{print $NF}') |"
            echo "| Python | $(python3 --version | cut -d' ' -f2) |"
          } > "$PREFIX/tools.txt"
          cat "$PREFIX/tools.txt"

      - name: Save the native build
        if: ${{ !inputs.release && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            buildscripts/prefix/${{ matrix.abi }}/lib/*.so
            buildscripts/prefix/${{ matrix.abi }}/sources.sha256
            buildscripts/prefix/${{ matrix.abi }}/tools.txt
          key: ${{ steps.key.outputs.key }}

      - name: List the shared libraries
        run: |
          ls -lL buildscripts/prefix/${{ matrix.abi }}/lib/*.so
          test -f buildscripts/prefix/${{ matrix.abi }}/lib/libmpv.so

      - uses: actions/upload-artifact@v7
        with:
          name: native-lib-${{ matrix.abi }}
          path: buildscripts/prefix/${{ matrix.abi }}/lib/*.so
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: native-info-${{ matrix.abi }}
          path: |
            buildscripts/prefix/${{ matrix.abi }}/sources.sha256
            buildscripts/prefix/${{ matrix.abi }}/tools.txt
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          ABI: ${{ matrix.abi }}
          HIT: ${{ steps.restore.outputs.cache-hit }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          if [ "$RELEASE" = true ]; then
            cache="not used (release build: built from source)"
          elif [ "$HIT" = true ]; then
            cache="**hit**: restored, the native build was skipped"
          else
            cache="**miss**: built from source"
          fi
          libmpv=buildscripts/prefix/$ABI/lib/libmpv.so
          {
            echo "### Native ($ABI)"
            echo
            echo "- Native cache: $cache"
            echo "- Key: \`$KEY\`"
            if [ -f "$libmpv" ]; then echo "- libmpv.so: $(( $(wc -c < "$libmpv") / 1024 )) KiB (unstripped)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  assemble:
    name: Assemble
    needs: native
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ inputs.release || false }}

      - name: Install SDK and NDK
        working-directory: buildscripts
        env:
          IN_CI: 1
        run: ./include/download-sdk.sh

      # Toolchain and Android targets come from the crate's rust-toolchain.toml
      - name: Install Rust
        working-directory: libmpv/src/main/rust
        run: |
          rustup toolchain install
          rustc -Vv
          cargo -V

      # On the host: formatting, lints, and the unit tests of everything that needs
      # neither JNI nor mpv (string conversion, handle table, lifecycle gate, events).
      # The test output is kept for the job summary.
      - name: Check and test the wrapper
        working-directory: libmpv/src/main/rust
        run: |
          set -o pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target x86_64-linux-android --all-targets -- -D warnings
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      - uses: actions/download-artifact@v8
        with:
          pattern: native-lib-*
          path: ${{ runner.temp }}/native

      - name: Put the native libraries into the prefixes
        run: |
          count=0
          for d in "$RUNNER_TEMP"/native/native-lib-*; do
            abi=${d##*/native-lib-}
            mkdir -p "buildscripts/prefix/$abi/lib"
            cp "$d"/*.so "buildscripts/prefix/$abi/lib/"
            count=$((count + 1))
          done
          [ "$count" -eq 4 ] || { echo "::error::Expected 4 ABIs, got $count"; exit 1; }

      # player.sh builds libplayer.so and fills libmpv/src/main/jniLibs/<abi>
      - name: Build the wrapper
        working-directory: buildscripts
        run: |
          for arch in armv7l arm64 x86 x86_64; do
            ./build.sh -n --arch "$arch" player
          done

      # The POM is the one a release publishes (same build files, same version); the SBOM
      # takes the JVM dependencies from it.
      - name: Bundle the AAR
        run: ./gradlew :libmpv:bundleReleaseAar :libmpv:generatePomFileForMavenPublication --no-configuration-cache -PVERSION_NAME="$VERSION"

      # Libraries, system dependencies, 16 KiB alignment, and libplayer.so's size against
      # its limit in check-aar.sh (the sizes go to the job summary)
      - name: Check AAR
        run: ./buildscripts/check-aar.sh

      # Every `external fun` has its Java_* export in libplayer.so of every ABI, and no
      # export is left without one: a missing one is an UnsatisfiedLinkError on a device
      - name: Check the JNI exports
        run: bash buildscripts/check-jni.sh

      # libmpv/api/libmpv.api is the public API apps compile against: a removed or
      # changed line breaks them, so any difference must be made on purpose
      # (check-api.sh --update) and shows up in review.
      - name: Check the public API
        run: ./buildscripts/check-api.sh libmpv/build/outputs/aar/libmpv-release.aar

      # The Kotlin code that needs neither JNI nor mpv (src/test)
      - name: Unit tests
        run: ./gradlew :libmpv:testDebugUnitTest --no-configuration-cache -PVERSION_NAME="$VERSION"

      - name: Write the SBOM and tool versions
        env:
          SBOM_POM: libmpv/build/publications/maven/pom-default.xml
        run: |
          mkdir -p "$RUNNER_TEMP/info"
          sbom="$RUNNER_TEMP/info/libmpv-$VERSION.cdx.json"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) ./buildscripts/sbom.sh "$VERSION" > "$sbom"
          python3 - "$sbom" <<'EOF'
          import json, sys
          bom = json.load(open(sys.argv[1]))
          assert bom["bomFormat"] == "CycloneDX", "not a CycloneDX document"
          problems = []
          for c in bom["components"]:
              if not c.get("version"):
                  problems.append(f"{c['name']}: no version")
              if not c.get("externalReferences"):
                  problems.append(f"{c['name']}: no source reference")
              if not c["bom-ref"].startswith("crate:") and not c.get("licenses"):
                  problems.append(f"{c['name']}: no licence")
          jvm = [c["name"] for c in bom["components"] if c["bom-ref"].startswith("maven:")]
          if not jvm:
              problems.append("no JVM dependencies (from the POM, SBOM_POM)")
          if problems:
              sys.exit("SBOM problems:\n  " + "\n  ".join(problems))
          print(f"SBOM: {len(bom['components'])} components, JVM dependencies: {', '.join(jvm)}")
          EOF
          {
            echo "| runner image (wrapper, AAR) | $ImageOS $ImageVersion |"
            echo "| Rust | $(cd libmpv/src/main/rust && rustc -V | cut -d' ' -f2-) |"
            echo "| JDK | $(java -version 2>&1 | head -n1) |"
            echo "| Gradle | $(./gradlew --version | sed -n 's/^Gradle //p') |"
          } > "$RUNNER_TEMP/info/tools-assemble.txt"
          cat "$RUNNER_TEMP/info/tools-assemble.txt"

      # The README's licence table must say what the SBOM says (versions are not compared,
      # so a dependency bump cannot fail this)
      - name: Check the README licences against the SBOM
        run: ./buildscripts/check-docs.sh

      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-release.aar
          path: ./libmpv/build/outputs/aar/libmpv-release.aar
          if-no-files-found: error

      # What the AAR was bundled from: the tests and publish.yaml bundle from these files
      - uses: actions/upload-artifact@v7
        with:
          name: jniLibs
          path: ./libmpv/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: build-info
          path: ${{ runner.temp }}/info/
          if-no-files-found: error

      # Also after a failure, with what there is. A suite that reports no tests fails a
      # job that otherwise passed.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          missing=0
          aar=libmpv/build/outputs/aar/libmpv-release.aar
          {
            echo "### Assemble"
            echo
            bash buildscripts/test-summary.sh header
            bash buildscripts/test-summary.sh cargo "Rust wrapper: host unit tests (cargo test)" "$RUNNER_TEMP/cargo-test.log" || missing=1
            bash buildscripts/test-summary.sh junit "Kotlin: JVM unit tests (testDebugUnitTest)" libmpv/build/test-results/testDebugUnitTest || missing=1
            echo
            if [ -f "$aar" ]; then
              echo "AAR \`libmpv-release.aar\` (version $VERSION): sha256 \`$(sha256sum "$aar" | cut -d' ' -f1)\`"
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" = 1 ] && [ "$JOB_STATUS" = success ]; then
            echo "::error::A test suite reported no tests"
            exit 1
          fi

  # One emulator per entry. fail-fast is off, so a failure on one entry does not cancel the
  # others: each reports its own result and test report, and `needs.test.result` (what the
  # Build job reads) is "failure" if any entry failed.
  test:
    name: Instrumented tests (API ${{ matrix.api }}, ${{ matrix.abi }})
    needs: assemble
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 34, abi: x86_64 } # a current Android
          - { api: 26, abi: x86_64 } # minSdk
          - { api: 29, abi: x86 } # 32-bit: the newest API with a default x86 image
    env:
      API: ${{ matrix.api }}
      ABI: ${{ matrix.abi }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ inputs.release || false }}

      - name: Install SDK
        working-directory: buildscripts
        env:
          IN_CI: 1
          SDK_WITHOUT_NDK: 1
        run: ./include/download-sdk.sh

      - uses: actions/download-artifact@v8
        with:
          name: jniLibs
          path: ./libmpv/src/main/jniLibs

      # Only the emulator's ABI: the app then has to load exactly these libraries (on x86,
      # the 32-bit ones), and the test APK stays small
      - name: Keep the ${{ matrix.abi }} libraries
        run: |
          [ -d "libmpv/src/main/jniLibs/$ABI" ] || { echo "::error::No $ABI libraries in the jniLibs artifact"; exit 1; }
          find libmpv/src/main/jniLibs -mindepth 1 -maxdepth 1 ! -name "$ABI" -exec rm -rf {} +
          ls -l "libmpv/src/main/jniLibs/$ABI"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.abi }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :libmpv:connectedDebugAndroidTest

      # Always uploaded, under a name per entry: the report is the proof of what ran
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report-api${{ matrix.api }}-${{ matrix.abi }}
          path: |
            ./libmpv/build/reports/androidTests/
            ./libmpv/build/outputs/androidTest-results/
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          missing=0
          {
            echo "### Instrumented tests (API $API, $ABI)"
            echo
            bash buildscripts/test-summary.sh header
            bash buildscripts/test-summary.sh junit "connectedDebugAndroidTest, API $API $ABI emulator" libmpv/build/outputs/androidTest-results || missing=1
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" = 1 ] && [ "$JOB_STATUS" = success ]; then
            echo "::error::The instrumented tests reported no tests"
            exit 1
          fi

  # publish.yaml does exactly this before it signs: bundle the AAR again in a fresh job
  # from the uploaded jniLibs, and refuse to release unless the bytes are those of the AAR
  # that was checked and tested. Run on every build, so a tag cannot be the first to find
  # out. (Same mode normalisation as publish.yaml.)
  reproducible:
    name: Reproducible AAR
    needs: assemble
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ inputs.release || false }}

      - name: Install SDK
        working-directory: buildscripts
        env:
          IN_CI: 1
          SDK_WITHOUT_NDK: 1
        run: ./include/download-sdk.sh

      - uses: actions/download-artifact@v8
        with:
          name: jniLibs
          path: ./libmpv/src/main/jniLibs

      - uses: actions/download-artifact@v8
        with:
          name: libmpv-release.aar
          path: ${{ runner.temp }}/built

      - name: Check the AAR is reproducible
        run: |
          find libmpv/src/main/jniLibs -type f -exec chmod 0644 {} +
          ./gradlew :libmpv:bundleReleaseAar --no-configuration-cache -PVERSION_NAME="$VERSION"
          built=$(sha256sum "$RUNNER_TEMP/built/libmpv-release.aar" | cut -d' ' -f1)
          actual=$(sha256sum libmpv/build/outputs/aar/libmpv-release.aar | cut -d' ' -f1)
          if [ "$actual" != "$built" ]; then
            echo "::error::Bundling the same jniLibs in a fresh job gave a different AAR ($actual, assemble's is $built); publish.yaml would refuse to release it"
            echo "### Reproducible AAR: **no** ($actual, assemble's is $built)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "AAR sha256: $actual"
          echo "### Reproducible AAR: yes, bundled again from the same jniLibs: sha256 \`$actual\`" >> "$GITHUB_STEP_SUMMARY"

  sources:
    name: Corresponding source
    needs: native
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Also fails if a git tag no longer resolves to the commit in include/tag-commits.txt
      - name: Download dependencies
        working-directory: buildscripts
        run: ./include/download-deps.sh

      - name: Apply patches
        working-directory: buildscripts
        run: ./patch.sh

      - uses: actions/download-artifact@v8
        with:
          pattern: native-info-*
          path: ${{ runner.temp }}/native-info

      # The ABI jobs download on their own (or restore a cache). The tarball is only the
      # corresponding source if it holds exactly what each of them built from.
      - name: Check the sources match every ABI build
        working-directory: buildscripts
        run: |
          ./include/hash-sources.sh > "$RUNNER_TEMP/sources.sha256"
          cat "$RUNNER_TEMP/sources.sha256"
          count=0 failed=0
          for f in "$RUNNER_TEMP"/native-info/native-info-*/sources.sha256; do
            count=$((count + 1))
            abi=$(basename "$(dirname "$f")"); abi=${abi#native-info-}
            if ! diff -u "$f" "$RUNNER_TEMP/sources.sha256"; then
              echo "::error::$abi was built from other sources than this job downloaded. If its native build came from the cache, an upstream tag probably moved: bump NATIVE_CACHE_EPOCH in build.yaml."
              failed=1
            fi
          done
          [ "$count" -eq 4 ] || { echo "::error::Expected source hashes for 4 ABIs, got $count"; exit 1; }
          exit $failed

      - name: Install Rust
        working-directory: libmpv/src/main/rust
        run: rustup toolchain install

      # Cargo.lock (--locked) pins every crate and its checksum, so the vendored crates
      # are the ones the wrapper was built with. The appended config makes cargo use them.
      - name: Vendor the Rust crates
        working-directory: libmpv/src/main/rust
        run: |
          cargo vendor --locked --versioned-dirs vendor > "$RUNNER_TEMP/vendor.toml"
          mkdir -p .cargo
          if [ -f .cargo/config.toml ] && grep -q '^\[source' .cargo/config.toml; then
            echo "::error::.cargo/config.toml already has a [source] table; merge cargo vendor's config by hand"
            exit 1
          fi
          cat "$RUNNER_TEMP/vendor.toml" >> .cargo/config.toml
          cargo metadata --offline --locked --format-version 1 > /dev/null
          echo "Vendored $(find vendor -mindepth 1 -maxdepth 1 -type d | wc -l) crates"

      # Packed in every build so this step cannot rot; only a release uploads it, and
      # only a release pays for full compression.
      - name: Pack corresponding source
        run: |
          set -o pipefail
          name="libmpv-$VERSION-sources"
          level=0
          [ "$RELEASE" = true ] && level=6
          tar --exclude=.git --exclude=./buildscripts/sdk --exclude=./libmpv/src/main/rust/target \
              --transform "s,^\.,$name," -cf - . | xz -T0 -"$level" > "$RUNNER_TEMP/$name.tar.xz"
          ls -lh "$RUNNER_TEMP/$name.tar.xz"
          {
            echo "### Corresponding source"
            echo
            echo "Every ABI was built from the sources this job downloaded ($(grep -c . "$RUNNER_TEMP/sources.sha256") dependencies), plus $(find libmpv/src/main/rust/vendor -mindepth 1 -maxdepth 1 -type d | wc -l) vendored crates: \`$name.tar.xz\`, $(du -h "$RUNNER_TEMP/$name.tar.xz" | cut -f1)$([ "$RELEASE" = true ] && echo ", uploaded" || echo " (uploaded only by a release)")."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.release }}
        with:
          name: sources
          path: ${{ runner.temp }}/libmpv-${{ env.VERSION }}-sources.tar.xz
          if-no-files-found: error
          compression-level: 0

  # The branch ruleset on main requires a check named exactly "Build". It must be red
  # unless every job above succeeded: a skipped or cancelled job counts as a failure
  # (a skipped required check would otherwise count as passed). always() makes this
  # job run, and report, in every one of those cases. For a matrix job (native, test),
  # needs.<job>.result is "success" only if every entry succeeded.
  build:
    name: Build
    needs: [lint, native, assemble, test, reproducible, sources]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          {
            echo "### Build"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -e 'length == 6 and all(.[]; .result == "success")' > /dev/null
