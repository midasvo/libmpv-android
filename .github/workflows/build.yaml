name: Build libmpv-android

on: 
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # used by sync-upstream.yaml, whose PRs don't trigger pull_request

permissions:
  contents: read

# Cancel superseded runs on pull requests only; every other run (main,
# workflow_dispatch) gets its own group and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip python3-jinja2 gperf nasm
          sudo pip3 install --break-system-packages meson

      - name: Download dependencies
        working-directory: ./buildscripts
        env:
          IN_CI: 1
          # retries for flaky hosts (lua.org TLS dropped a main build); download-deps.sh reads $WGET
          WGET: wget --tries=5 --waitretry=10 --retry-connrefused --retry-on-host-error
        run: ./download.sh

      - name: Apply patches
        working-directory: ./buildscripts
        run: ./patch.sh

      - name: Build
        working-directory: ./buildscripts
        run: ./build.sh

      - name: Check AAR
        run: ./buildscripts/check-aar.sh

      # Uploaded before the emulator test so a flaky emulator doesn't lose it.
      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-release.aar
          path: ./libmpv/build/outputs/aar/libmpv-release.aar

      # Smoke test: load libmpv on an x86_64 emulator. jniLibs is already
      # filled by the build step.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :libmpv:connectedDebugAndroidTest

      # Always uploaded: Gradle does not print the test count, so the report is
      # the only proof the tests ran on a passing build.
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: |
            ./libmpv/build/reports/androidTests/
            ./libmpv/build/outputs/androidTest-results/
          if-no-files-found: warn
