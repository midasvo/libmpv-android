name: Pages

# Publishes site/ to GitHub Pages at https://midasvo.nl/libmpv-android/ (the custom domain of
# midasvo.github.io). Needs Settings → Pages → Source set to "GitHub Actions". Fork-only: upstream
# has no site/, and the guard keeps this from running anywhere else. Only main deploys, also by hand.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    if: github.repository == 'midasvo/libmpv-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
